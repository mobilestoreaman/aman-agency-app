# ============================================================
# Aman Agency — Docker Compose Dev Overrides
#
# Extends docker-compose.yml for local development:
#   - Hot reload for backend (Air)
#   - Vite dev server for frontend (HMR)
#   - MongoDB port exposed
#   - Verbose logging
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

services:

  mongo:
    ports:
      - "27017:27017"    # expose for local tools (Compass, mongosh) + host.docker.internal access

  backend:
    build:
      context: ..
      dockerfile: infra/backend.dev.Dockerfile    # uses Air for hot reload
    ports:
      - "3000:3000"
    environment:
      APP_ENV: development
    volumes:
      - ../backend:/app                            # mount source for live reload
      - pdf_storage:/app/storage/invoices          # named volume from base compose file
    command: ["air", "-c", ".air.toml"]
    # Air needs time to do the initial compile before the server is up.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.dev.Dockerfile   # node dev server
    ports:
      - "5173:5173"                                # Vite HMR
    volumes:
      - ../frontend:/app
      - /app/node_modules                          # anonymous vol to protect node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    # Override the base healthcheck: dev runs Vite on 5173, not nginx on 80.
    # Vite takes a few seconds to compile on first start, so give it extra time.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # nginx is not used in dev — frontend is served directly by Vite.
  nginx:
    profiles:
      - disabled

  # nginx:
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
  #     - pdf_storage:/app/storage/invoices:ro
