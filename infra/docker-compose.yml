# ============================================================
# Aman Agency — Docker Compose (Production)
#
# Services:
#   nginx      — reverse proxy (port 80)
#   backend    — Go Fiber API
#   frontend   — React PWA (Nginx static)
#   mongo      — MongoDB 7
#   mongo-express — DB admin UI (profile: dev only)
#
# Usage:
#   Production : docker-compose up -d
#   Dev UI     : docker-compose --profile dev up -d
# ============================================================

version: "3.9"

# ── Named volumes ─────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  pdf_storage:
    driver: local
  certbot_certs:    # Let's Encrypt certificates
    driver: local
  certbot_www:      # ACME challenge webroot
    driver: local

# ── Shared network ────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

# ── Services ──────────────────────────────────────────────────
services:

  # ── MongoDB ────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: aman_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_INITDB_DATABASE}
      MONGO_APP_PASSWORD:         ${MONGO_APP_PASSWORD}   # injected into 01_init.js
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro   # seed scripts
    networks:
      - app_net
    healthcheck:
      # Authenticate as root so the health status is only "healthy" once
      # MongoDB has finished running /docker-entrypoint-initdb.d scripts
      # and is accepting authenticated connections.
      # Using ping without auth passes too early — before aman_app is created —
      # causing the backend to start and fail to connect.
      test:
        - "CMD-SHELL"
        - >
          mongosh --quiet
          -u $$MONGO_INITDB_ROOT_USERNAME
          -p $$MONGO_INITDB_ROOT_PASSWORD
          --authenticationDatabase admin
          --eval "db.adminCommand('ping')"
          || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Not exposed to host in production — only reachable inside app_net
    # Uncomment below for local dev debugging:
    # ports:
    #   - "27017:27017"

  # ── Go Fiber Backend ───────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    container_name: aman_backend
    restart: unless-stopped
    # env_file is the ONLY source of env vars for this service.
    # Do NOT add an environment: block with ${VAR} substitutions here —
    # Compose resolves ${VAR} from the host shell, not from env_file, so
    # any variable not exported in the shell gets set to an empty string,
    # silently overriding the correct values loaded from env_file.
    env_file:
      - .env
    volumes:
      - pdf_storage:/app/storage/invoices
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── React PWA Frontend ────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: aman_frontend
    restart: unless-stopped
    networks:
      - app_net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: aman_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"         # active once ssl.conf + certs are in place
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - pdf_storage:/app/storage/invoices:ro
      - certbot_certs:/etc/letsencrypt:ro        # TLS certs (read-only)
      - certbot_www:/var/www/certbot:ro           # ACME challenge webroot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Certbot (auto-renew TLS certificates) ─────────────────
  # Runs every 12 hours; exits 0 if no renewal needed.
  # Nginx is reloaded via a shared signal after renewal.
  certbot:
    image: certbot/certbot:latest
    container_name: aman_certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"
    networks:
      - app_net

  # ── Mongo Express (DEV ONLY) ──────────────────────────────
  # Start with: docker-compose --profile dev up -d
  mongo-express:
    image: mongo-express:1.0
    container_name: aman_mongo_express
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_URL:           mongodb://${ME_CONFIG_MONGODB_ADMINUSERNAME}:${ME_CONFIG_MONGODB_ADMINPASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME:    ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD:    ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_net
