# ============================================================
# Nginx — Main Config (reverse proxy layer)
# ============================================================

user  nginx;
worker_processes  auto;            # one per CPU core
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json image/svg+xml
        font/woff font/woff2;

    # ── Security headers (applied globally) ──────────────────
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header X-XSS-Protection          "1; mode=block"  always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # camera=(self) allows the app's own origin to use the camera (barcode scanning).
    # microphone is not used — deny it globally.
    add_header Permissions-Policy        "camera=(self), microphone=()" always;

    # ── Rate limiting zones ───────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ── Client body size (for file uploads) ──────────────────
    client_max_body_size 10M;

    # ── Include server blocks ─────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
