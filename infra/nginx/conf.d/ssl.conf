# ============================================================
# Nginx — TLS / HTTPS Server Block (Let's Encrypt / Certbot)
#
# HOW TO ENABLE:
#   1. Set DOMAIN and CERTBOT_EMAIL in infra/.env
#   2. Run the initial cert provisioning:
#        ./scripts/init-ssl.sh
#   3. Nginx will reload automatically with this config active.
#
# This file is INACTIVE until certs exist at:
#   /etc/letsencrypt/live/$DOMAIN/fullchain.pem
#
# The default.conf HTTP block (port 80) is repurposed to:
#   a) Serve the ACME challenge for Certbot renewals
#   b) Redirect all other traffic to HTTPS
# ============================================================

# ── Upstream references (defined in default.conf, reused here)
# upstream backend  { server backend:3000; }
# upstream frontend { server frontend:80;  }

# ── HTTP → HTTPS redirect + ACME challenge ───────────────────
# NOTE: When ssl.conf is active, replace the server{} block in
# default.conf with this leaner one (shown below for reference):
#
#   server {
#       listen 80;
#       server_name ${DOMAIN} www.${DOMAIN};
#       location /.well-known/acme-challenge/ {
#           root /var/www/certbot;
#       }
#       location / {
#           return 301 https://$host$request_uri;
#       }
#   }
#
# The full redirect server block is managed by init-ssl.sh.

# ── HTTPS Server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ${NGINX_DOMAIN};   # templated by envsubst at startup

    # ── Certificates (provisioned by Certbot) ────────────────
    ssl_certificate     /etc/letsencrypt/live/${NGINX_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${NGINX_DOMAIN}/chain.pem;

    # ── TLS Protocol & Ciphers (Mozilla Modern profile) ──────
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers  off;

    # ── TLS Session Cache ────────────────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── OCSP Stapling ────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ── HSTS (6 months, include subdomains) ──────────────────
    # WARNING: only enable after confirming HTTPS works end-to-end.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header X-XSS-Protection          "1; mode=block"  always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── API proxy ─────────────────────────────────────────────
    # Reuses the rate-limit zones defined in nginx.conf http{} context
    # (api: 20r/s  auth: 5r/m) — shared across HTTP and HTTPS server blocks.
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering        off;
    }

    # ── Auth — tighter rate limit ─────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Health (no rate limit, no access log) ────────────────
    location /api/health {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Static (PDF invoices) ─────────────────────────────────
    location /static/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Hide the backend's own Cache-Control before setting ours,
        # otherwise the client sees two conflicting Cache-Control headers.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Frontend PWA ──────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        add_header Service-Worker-Allowed "/";
    }
}
