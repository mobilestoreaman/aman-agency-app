# ============================================================
# Nginx — Frontend Container Config
# Serves the React PWA static build.
# Handles SPA client-side routing (all paths → index.html).
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript
               application/json application/manifest+json
               image/svg+xml font/woff font/woff2;

    # ── PWA Manifest + Service Worker ────────────────────────
    location = /manifest.json {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── Hashed static assets — cache forever ─────────────────
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — all routes serve index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Security ─────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;

    # CSP — camera access is governed by Permissions-Policy (set in nginx.conf),
    # not by CSP. 'camera-src' was a proposed directive that was never standardised
    # and is silently ignored by all browsers — removed.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob:; \
         connect-src 'self'; \
         media-src 'self' blob:;" \
        always;
}
