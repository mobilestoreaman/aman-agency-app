# ============================================================
# Nginx — Reverse Proxy Server Block
# Handles:
#   /api/*        → backend:3000  (Go Fiber)
#   /static/*     → backend:3000  (PDF/invoice files)
#   /             → frontend:80   (React PWA)
# ============================================================

upstream backend {
    server backend:3000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ── API proxy ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto set to $scheme; in HTTP mode this is "http" which is correct.
        # HTTPS requests are handled by ssl.conf which hardcodes "https" to prevent spoofing.
        # Clients cannot override this header — nginx always sets it based on the listener.
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Disable buffering for SSE / streaming (future use)
        proxy_buffering off;
    }

    # ── Auth endpoints — tighter rate limit ──────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto set to $scheme; in HTTP mode this is "http" which is correct.
        # HTTPS requests are handled by ssl.conf which hardcodes "https" to prevent spoofing.
        # Clients cannot override this header — nginx always sets it based on the listener.
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static files (PDF invoices served by backend) ────────
    location /static/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;

        # Cache PDFs aggressively in browser
        proxy_hide_header  Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Health check (bypass rate limit) ─────────────────────
    location /api/health {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Frontend PWA ──────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Support PWA service worker scope
        add_header Service-Worker-Allowed "/";
    }
}
