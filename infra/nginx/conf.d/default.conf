# ============================================================
# Nginx — Reverse Proxy Server Block
# Handles:
#   /api/*        → backend:3000  (Go Fiber)
#   /static/*     → backend:3000  (PDF/invoice files)
#   /             → frontend:80   (React PWA)
# ============================================================

upstream backend {
    server backend:3000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────
# All plain-HTTP traffic (port 80) is permanently redirected to HTTPS.
# Exception: Let's Encrypt ACME challenge path (.well-known/acme-challenge)
# must be served over HTTP so Certbot can prove domain ownership.
server {
    listen 80;
    server_name _;

    # Serve ACME challenges for Let's Encrypt certificate issuance/renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS (308 Permanent Redirect preserves method)
    location / {
        return 308 https://$host$request_uri;
    }
}

# ── HTTPS server block ────────────────────────────────────────
# All application traffic is served from here.
# TLS configuration (certificate paths, protocols, ciphers) lives in ssl.conf.
server {
    listen 443 ssl;
    server_name _;

    # ── API proxy ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto is always "https" here because this block only listens
        # on port 443. Using $scheme is safe; it is determined by nginx from the
        # listener, not from a client-supplied header, so it cannot be spoofed.
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Disable buffering for SSE / streaming (future use)
        proxy_buffering off;
    }

    # ── Auth endpoints — tighter rate limit ──────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto is always "https" here because this block only listens
        # on port 443. Using $scheme is safe; it is determined by nginx from the
        # listener, not from a client-supplied header, so it cannot be spoofed.
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static files (PDF invoices served by backend) ────────
    location /static/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;

        # Cache PDFs aggressively in browser
        proxy_hide_header  Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Health check (bypass rate limit) ─────────────────────
    location /api/health {
        proxy_pass http://backend;
        access_log off;
    }

    # ── Frontend PWA ──────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Support PWA service worker scope
        add_header Service-Worker-Allowed "/";
    }
}
