# Air — Go hot reload config (dev only)
root = "."
tmp_dir = "/tmp/air"

[build]
  cmd        = "go build -o /tmp/air/server ./cmd/server"
  bin        = "/tmp/air/server"
  full_bin   = "/tmp/air/server"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor"]
  delay      = 1000         # ms
  kill_delay = 500          # ms
  rerun      = false

[log]
  time = true

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[screen]
  clear_on_rebuild = true
